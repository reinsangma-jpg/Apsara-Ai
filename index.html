<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NSS Access Portal</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background: #07130d;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Optional background video: replace the URL below if needed. */
    .video-frame {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 56.25vw;
      min-width: 177.78vh;
      min-height: 100vh;
      transform: translate(-50%, -50%);
      z-index: -3;
      border: 0;
      pointer-events: none;
      background: #07130d;
    }

    .video-overlay {
      position: fixed;
      inset: 0;
      z-index: -2;
      background: rgba(0, 0, 0, 0.16);
      pointer-events: none;
    }

    .page {
      width: min(92%, 560px);
      position: relative;
      z-index: 1;
    }

    .card {
      padding: 34px 30px 30px;
      border: 1px solid rgba(255,255,255,.30);
      border-radius: 26px;
      background: rgba(8, 20, 14, .22);
      box-shadow: 0 20px 70px rgba(0,0,0,.28);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,.13);
      border: 1px solid rgba(255,255,255,.22);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    h1 {
      margin: 18px 0 8px;
      font-size: clamp(30px, 7vw, 46px);
      line-height: 1.05;
    }

    .subtitle {
      margin: 0 auto 25px;
      max-width: 430px;
      color: rgba(255,255,255,.82);
      line-height: 1.55;
      font-size: 15px;
    }

    label {
      display: block;
      text-align: left;
      margin: 0 0 9px 4px;
      font-size: 13px;
      font-weight: 700;
      color: rgba(255,255,255,.88);
    }

    input {
      width: 100%;
      height: 56px;
      border: 1px solid rgba(255,255,255,.30);
      outline: none;
      border-radius: 15px;
      padding: 0 17px;
      color: #fff;
      background: rgba(255,255,255,.11);
      font-size: 16px;
      transition: .2s ease;
    }

    input::placeholder { color: rgba(255,255,255,.55); }

    input:focus {
      border-color: rgba(255,255,255,.75);
      box-shadow: 0 0 0 3px rgba(255,255,255,.08);
    }

    .status {
      min-height: 58px;
      margin: 16px 0 12px;
      padding: 13px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.45;
      display: none;
      text-align: left;
    }

    .status.error {
      display: block;
      color: #ffd9d9;
      background: rgba(150, 20, 20, .24);
      border: 1px solid rgba(255, 110, 110, .32);
    }

    .status.success {
      display: block;
      color: #d9ffe7;
      background: rgba(15, 130, 65, .22);
      border: 1px solid rgba(100, 255, 155, .30);
    }

    #enterBtn {
      width: 100%;
      height: 57px;
      border: 0;
      border-radius: 16px;
      color: #fff;
      background: rgba(255,255,255,.16);
      font-size: 16px;
      font-weight: 800;
      cursor: not-allowed;
      opacity: .42;
      transition: .25s ease;
    }

    #enterBtn.active {
      cursor: pointer;
      opacity: 1;
      background: linear-gradient(135deg, #20b66a, #0d8f51);
      box-shadow: 0 0 0 1px rgba(126,255,185,.35),
                  0 0 24px rgba(28,220,120,.65),
                  0 10px 30px rgba(0,0,0,.25);
      animation: glow 1.6s ease-in-out infinite alternate;
    }

    #enterBtn.active:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 0 1px rgba(126,255,185,.45),
                  0 0 34px rgba(28,220,120,.85),
                  0 14px 34px rgba(0,0,0,.30);
    }

    @keyframes glow {
      from { filter: brightness(1); }
      to { filter: brightness(1.13); }
    }

    .footer {
      margin-top: 20px;
      color: rgba(255,255,255,.55);
      font-size: 11px;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      .card { padding: 28px 20px 23px; border-radius: 21px; }
      h1 { font-size: 31px; }
      .subtitle { font-size: 14px; }
    }
  </style>
</head>

<body>

  <!--
    BACKGROUND VIDEO:
    If you want a video, replace the src below with your own direct MP4/WebM URL.
    A Cloudinary player/embed URL cannot be used directly in a <video> tag.
  -->
  <video class="video-bg" autoplay muted loop playsinline preload="auto" aria-hidden="true">
    <!-- Example:
    <source src="YOUR_DIRECT_VIDEO_URL.mp4" type="video/mp4">
    -->
  </video>

  <div class="video-overlay"></div>

  <main class="page">
    <section class="card">
      <div class="badge">NSS Access Portal</div>

      <h1>Welcome</h1>
      <p class="subtitle">
        Enter your name exactly as registered for the plantation activity
        to access your certificate portal.
      </p>

      <label for="nameInput">Enter your name</label>
      <input
        id="nameInput"
        type="text"
        autocomplete="off"
        spellcheck="false"
        placeholder="e.g. Reinhardson Sangma"
        aria-describedby="status"
      >

      <div id="status" class="status" role="alert"></div>

      <button id="enterBtn" type="button" disabled>
        Enter Website
      </button>

      <div class="footer">
        Access is provided only to names registered for the activity.
      </div>
    </section>
  </main>

  <script>
    /*
      ============================================================
      EDITABLE NAME LIST
      ============================================================

      Replace the 40 placeholder names (101 to 140) with your
      actual names later.

      You can also add/remove names whenever you want.
    */

    const allowedNames = [
      "Reinhardson Sangma",
      "Rakesh Dewri",
      "Dhruba Nath",
      "Juna Nath",

      // PLACEHOLDER NAMES — replace these later
      "Pujashree Devi",
      "102",
      "103",
      "104",
      "105",
      "106",
      "107",
      "108",
      "109",
      "110",
      "111",
      "112",
      "113",
      "114",
      "115",
      "116",
      "117",
      "118",
      "119",
      "120",
      "121",
      "122",
      "123",
      "124",
      "125",
      "126",
      "127",
      "128",
      "129",
      "130",
      "131",
      "132",
      "133",
      "134",
      "135",
      "136",
      "137",
      "138",
      "139",
      "140"
    ];

    const REDIRECT_URL = "https://reinsangma-jpg.github.io/hehe/";

    const nameInput = document.getElementById("nameInput");
    const enterBtn = document.getElementById("enterBtn");
    const statusBox = document.getElementById("status");

    function normalizeName(value) {
      return value
        .trim()
        .replace(/\s+/g, " ")
        .toLowerCase();
    }

    function findAllowedName(value) {
      const normalized = normalizeName(value);

      if (!normalized) return null;

      return allowedNames.find(
        name => normalizeName(name) === normalized
      ) || null;
    }

    function checkName() {
      const enteredName = nameInput.value;
      const matchedName = findAllowedName(enteredName);

      if (!normalizeName(enteredName)) {
        enterBtn.disabled = true;
        enterBtn.classList.remove("active");
        statusBox.className = "status";
        statusBox.textContent = "";
        return;
      }

      if (matchedName) {
        enterBtn.disabled = false;
        enterBtn.classList.add("active");

        statusBox.className = "status success";
        statusBox.textContent =
          "✓ Name verified. You have access. Click “Enter Website” to continue.";
      } else {
        enterBtn.disabled = true;
        enterBtn.classList.remove("active");

        statusBox.className = "status error";
        statusBox.textContent =
          "Sorry, but we think you didn't submit the photo with geo-tag within the given period of time. If you think we are wrong, kindly ask your admin to give access to you. We are very sorry about that.";
      }
    }

    nameInput.addEventListener("input", checkName);

    nameInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter" && !enterBtn.disabled) {
        enterBtn.click();
      }
    });

    enterBtn.addEventListener("click", function() {
      if (!enterBtn.disabled && findAllowedName(nameInput.value)) {
        window.location.href = REDIRECT_URL;
      }
    });
  </script>

</body>
</html>
